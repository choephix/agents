id = "stefan.pane-breakout"
name = "Pane Breakout"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Break the focused pane out into its own tab, and fold it back home"
platforms = ["linux"]

[[actions]]
id = "breakout"
title = "Break pane out into its own tab"
contexts = ["pane"]
command = ["bash", "breakout.sh", "out"]

[[actions]]
id = "fold"
title = "Fold pane back into its origin tab"
contexts = ["pane"]
command = ["bash", "breakout.sh", "back"]
